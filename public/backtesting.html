  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4f68ab41-3a1a-466c-8491-6ef484615c5a\"><\u002Fscript>\n<\u002Fhead>\n\n<body>\n<x-dc>\n<helmet>\n<style>\n  @keyframes vx-draw { to { stroke-dashoffset: 0; } }\n  @keyframes vx-fade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes vx-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }\n  @keyframes vx-pop { 0% { opacity: 0; transform: scale(0.4); } 100% { opacity: 1; transform: scale(1); } }\n  @keyframes vx-spin-in { from { opacity: 0; transform: rotate(-120deg) scale(0.7); } to { opacity: 1; transform: rotate(0) scale(1); } }\n  @keyframes vx-scan { 0% { transform: translateY(-120%); } 100% { transform: translateY(520%); } }\n  @keyframes vx-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }\n  @keyframes vx-shimmer { from { transform: translateX(-150%); } to { transform: translateX(150%); } }\n  @keyframes vx-spin { to { transform: rotate(360deg); } }\n  @keyframes vx-glow { 0%,100% { opacity: 0.4; } 50% { opacity: 0.85; } }\n  @keyframes vx-float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,30px) scale(1.12); } }\n  @keyframes vx-float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,40px) scale(1.18); } }\n  @keyframes vx-sheen { 0% { transform: translateX(-60%); } 100% { transform: translateX(220%); } }\n  @keyframes vx-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }\n  @keyframes vx-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }\n  html, body { background: #090b11; margin: 0; }\n  body { font-family: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Inter, sans-serif; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  .vx-scroll::-webkit-scrollbar { width: 7px; height: 7px; }\n  .vx-scroll::-webkit-scrollbar-track { background: transparent; }\n  .vx-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 6px; }\n  .vx-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }\n  input.vx-in { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; color: #FAFAF7; outline: none; transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease; }\n  input.vx-in:focus { border-color: rgba(31,111,235,0.65); box-shadow: 0 0 0 4px rgba(31,111,235,0.14); background: rgba(255,255,255,0.06); }\n  input.vx-mono { font-family: ui-monospace, Menlo, monospace; font-weight: 700; letter-spacing: -0.01em; }\n  select.vx-in { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-family: inherit; color: #FAFAF7; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; }\n  select.vx-in option { background: #0f131c; color: #FAFAF7; }\n  input.vx-in::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }\n  input[type=number].vx-in::-webkit-inner-spin-button { opacity: 0.3; }\n  .vx-card { position: relative; background: linear-gradient(160deg, rgba(255,255,255,0.058) 0%, rgba(255,255,255,0.018) 100%); border: 1px solid rgba(255,255,255,0.09); border-radius: 20px; box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 24px 60px -30px rgba(0,0,0,0.7); }\n  .vx-tile { position: relative; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.014)); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset; transition: transform 220ms cubic-bezier(0.22,1,0.36,1), border-color 220ms ease, box-shadow 220ms ease; }\n  .vx-tile::before { content: \"\"; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, transparent, var(--vx-accent, #1F6FEB), transparent); opacity: 0; transition: opacity 220ms ease; }\n  .vx-tile:hover { transform: translateY(-4px); border-color: rgba(31,111,235,0.4); box-shadow: 0 22px 48px -16px rgba(3,9,25,0.85), 0 0 0 1px rgba(31,111,235,0.12); }\n  .vx-tile:hover::before { opacity: 1; }\n  .vx-chip { border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: rgba(250,250,247,0.6); border-radius: 99px; padding: 6px 13px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 160ms ease; font-family: inherit; }\n  .vx-chip:hover { border-color: rgba(255,255,255,0.28); color: rgba(250,250,247,0.92); }\n  .vx-chip.on { border-color: rgba(31,111,235,0.5); background: rgba(31,111,235,0.14); color: #6ea8ff; }\n  .vx-x { width: 34px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 11px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); color: rgba(250,250,247,0.3); cursor: pointer; transition: all 150ms ease; }\n  .vx-x:hover { border-color: rgba(220,38,38,0.45); background: rgba(220,38,38,0.1); color: #ef5959; }\n  .vx-tabbtn { position: relative; background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 600; color: rgba(250,250,247,0.4); padding: 14px 2px; cursor: pointer; transition: color 180ms ease; display: inline-flex; align-items: center; gap: 8px; }\n  .vx-tabbtn:hover { color: rgba(250,250,247,0.72); }\n  .vx-tabbtn.on { color: #FAFAF7; }\n  .vx-run { width: 100%; border: none; border-radius: 16px; padding: 15px; font-family: inherit; font-size: 15px; font-weight: 700; color: #FAFAF7; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 14px 34px rgba(8,15,30,0.45), inset 0 1px 0 rgba(255,255,255,0.18); transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease; } <script>
(function() {
  var TOPBAR_H = 52;
  var injected = false;

  function hideBundleTopbar() {
    // Walk text nodes to find "Market data live", then hide its wide block ancestor
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while ((node = walker.nextNode())) {
      if (node.textContent.indexOf('Market data live') !== -1) {
        var el = node.parentElement;
        while (el && el !== document.body) {
          var rect = el.getBoundingClientRect();
          if (rect.width > window.innerWidth * 0.5 && rect.height > 20 && rect.height < 200) {
            el.style.setProperty('display', 'none', 'important');
            return;
          }
          el = el.parentElement;
        }
        break;
      }
    }
  }

  function injectTopbar() {
    if (injected || !document.body) return;
    injected = true;

    hideBundleTopbar();

    var bar = document.createElement('div');
    bar.id = '__vx-topbar';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;height:' + TOPBAR_H + 'px;background:rgba(8,11,20,0.98);border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:2147483647;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);';
    bar.innerHTML = '<a href="/" style="display:flex;align-items:center;gap:9px;text-decoration:none;">'
      + '<div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#1F6FEB,#0d3ba8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(31,111,235,.4);flex-shrink:0;">'
      + '<svg width="16" height="16" viewBox="0 0 22 22" fill="none"><path d="M 2 2 L 10 20 L 13 20 L 13 14 L 16 14 L 16 8 L 19 8 L 19 2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '</div>'
      + '<span style="font-family:ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:14px;letter-spacing:-.3px;color:#FAFAF7;">VANETEX</span>'
      + '<span style="font-family:ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:10px;letter-spacing:.16em;color:rgba(250,250,247,0.38);margin-left:1px;">BACKTEST</span>'
      + '</a>'
      + '<div id="__vx-alloc-err" style="display:none;align-items:center;gap:6px;background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.3);border-radius:8px;padding:5px 12px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;font-weight:600;color:#ff4d5e;">'
      + '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 5v4M8 11h.01M2 14h12L8 2 2 14z" stroke="#ff4d5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '&nbsp;Allocation exceeds 100% &#8212; reduce before running'
      + '</div>';
    document.body.insertBefore(bar, document.body.firstChild);
    document.body.style.paddingTop = TOPBAR_H + 'px';

    var errEl = document.getElementById('__vx-alloc-err');
    var errTimer = null;

    function getAllocTotal() {
      var inputs = document.querySelectorAll('input[type="number"]');
      var total = 0;
      inputs.forEach(function(inp) { total += parseFloat(inp.value) || 0; });
      return Math.round(total * 100) / 100;
    }

    // Only intercept clicks on actual <button> elements whose own text contains "run"
    document.addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var txt = (btn.textContent || '').trim().toLowerCase();
      if (txt.indexOf('run') === -1) return;

      var total = getAllocTotal();
      if (total > 100) {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (errEl) {
          errEl.style.display = 'flex';
          clearTimeout(errTimer);
          errTimer = setTimeout(function() { errEl.style.display = 'none'; }, 4000);
        }
      } else {
        if (errEl) errEl.style.display = 'none';
      }
    }, true);
  }

  var poll = setInterval(function() {
    var loading = document.getElementById('__bundler_loading');
    var thumbnail = document.getElementById('__bundler_thumbnail');
    var bodyReady = document.body && document.body.childElementCount > 2;
    if (bodyReady && (!loading || loading.style.display === 'none') && (!thumbnail || thumbnail.style.display === 'none')) {
      clearInterval(poll);
      injectTopbar();
    }
  }, 150);

  window.addEventListener('load', function() {
    setTimeout(function() { if (!injected) injectTopbar(); }, 4000);
  });
})();
</script>
