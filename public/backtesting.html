<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Vanetex Backtest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#04050a; --bg1:#0a0d17;
  --acc:#2F7BFF; --acc2:#34d3ff; --glow:47,123,255;
  --pos:#1fd397; --neg:#ff4d5e; --warn:#f5a524;
  --txt:#eef1f8; --mut:#7c8499; --line:rgba(255,255,255,.07);
  --ui:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#04050a;}
body{font-family:var(--ui);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@keyframes auroraDrift{0%{transform:translate(-4%,-2%) scale(1)}50%{transform:translate(5%,4%) scale(1.18)}100%{transform:translate(-4%,-2%) scale(1)}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes vx-spin{to{transform:rotate(360deg)}}
@keyframes vx-pulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.45)}70%{box-shadow:0 0 0 9px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
.mic-listening{animation:vx-pulse 1.4s ease-out infinite;}
button{font-family:var(--ui);cursor:pointer}
input,select{font-family:var(--ui)}
.logolink{transition:opacity .15s ease}
.logolink:hover{opacity:.78}
.navlink:hover{color:var(--acc2) !important}
.presetchip{transition:background .15s ease,border-color .15s ease}
.presetchip:hover{border-color:rgba(var(--glow),.4) !important}
.tabbtn{transition:color .15s ease}
.tabbtn:hover{color:var(--txt) !important}
.runbtn:hover{filter:brightness(1.1)}
.savedcard{transition:transform .15s ease,border-color .15s ease}
.savedcard:hover{border-color:rgba(var(--glow),.35) !important}
.delx{opacity:.4;transition:opacity .15s ease,color .15s ease}
.delx:hover{opacity:1;color:var(--neg) !important}
.holdrow .rmx{opacity:.5;transition:opacity .15s ease,color .15s ease}
.holdrow .rmx:hover{opacity:1;color:var(--neg) !important}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}
input::placeholder{color:var(--mut)}
select{appearance:none;-webkit-appearance:none}
.eqhover{cursor:crosshair}
.btLayout{display:grid;grid-template-columns:340px 1fr;gap:0;}
.btSidebar{padding:26px 22px;border-right:1px solid var(--line);}
.btMain{padding:26px 30px;}
@media (max-width:860px){
  .btLayout{grid-template-columns:1fr;}
  .btSidebar{border-right:none;border-bottom:1px solid var(--line);padding:20px 16px;}
  .btMain{padding:20px 16px;}
  .btDdAlloc{grid-template-columns:1fr !important;}
  header{height:auto !important;flex-wrap:wrap;row-gap:8px;padding:12px 16px !important;}
}
</style>
</head>
<body>

<div style="position:relative;min-height:100vh;background:radial-gradient(120% 90% at 78% -10%,rgba(var(--glow),.14),transparent 48%),radial-gradient(90% 70% at 12% 4%,rgba(52,211,255,.05),transparent 50%),linear-gradient(180deg,#06080f 0%,#04050a 70%);">

  <div aria-hidden="true" style="position:fixed;top:-22%;left:18%;width:760px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(var(--glow),.28),transparent 62%);filter:blur(46px);animation:auroraDrift 19s ease-in-out infinite;pointer-events:none;z-index:0;"></div>
  <div aria-hidden="true" style="position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.024) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(130% 100% at 50% 0%,#000 35%,transparent 78%);mask-image:radial-gradient(130% 100% at 50% 0%,#000 35%,transparent 78%);pointer-events:none;z-index:0;"></div>

  <div style="position:relative;z-index:1;">

    <!-- TOP BAR -->
    <header style="display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(7,9,16,.55);backdrop-filter:blur(18px);">
      <a href="/index.html" class="logolink" style="display:flex;align-items:center;gap:11px;">
        <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#0d3ba8);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(var(--glow),.5),inset 0 1px 0 rgba(255,255,255,.3);">
          <svg width="17" height="17" viewBox="0 0 22 22" fill="none"><path d="M 2 2 L 10 20 L 13 20 L 13 14 L 16 14 L 16 8 L 19 8 L 19 2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="line-height:1;">
          <div style="font-size:15px;font-weight:700;letter-spacing:.02em;">VANETEX</div>
          <div style="font-size:8.5px;font-weight:600;letter-spacing:.34em;color:var(--acc2);margin-top:3px;">BACKTEST</div>
        </div>
      </a>
      <div style="flex:1;"></div>
      <a href="/intelligence.html" class="navlink" style="font-size:12.5px;font-weight:600;color:var(--mut);">Intelligence →</a>
      <div style="display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--pos);border:1px solid rgba(31,211,151,.3);background:rgba(31,211,151,.08);border-radius:99px;padding:5px 11px;" title="Real monthly historical prices from Yahoo Finance (dividend/split-adjusted).">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--pos);"></span>REAL DATA
      </div>
    </header>

    <!-- BODY -->
    <div class="btLayout" style="max-width:1600px;margin:0 auto;align-items:start;">

      <!-- SIDEBAR -->
      <div id="sidebar" class="btSidebar"></div>

      <!-- MAIN -->
      <div class="btMain" style="min-width:0;">
        <div id="tabbar" style="display:flex;align-items:center;gap:26px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px;"></div>
        <div id="content"></div>
      </div>

    </div>
  </div>
</div>

<script>
const bt = {
  PALETTE: ['#2F7BFF','#1fd397','#f5a524','#9b6bff','#34d3ff','#ec4899','#64748b','#22d3ee'],
  // Same bucketing convention Intelligence uses for its sector heatmap, so a
  // stock classified "Technology" there reads the same way here.
  SECTOR_BUCKETS: [
    { key:'Technology', match:/semi|software|hardware|electronic|technology/i },
    { key:'Communication', match:/internet|media|entertainment|telecom|communication/i },
    { key:'Consumer', match:/consumer|retail|e-commerce|auto/i },
    { key:'Financials', match:/financ|fintech|bank|insur|capital markets/i },
    { key:'Healthcare', match:/health|pharma|biotech/i },
    { key:'Energy', match:/energy|oil|gas/i },
    { key:'Industrials', match:/industrial|aerospace|defense/i },
    { key:'ETFs / Index', match:/etf|index/i },
  ],
  sectorBucket(industry) {
    // Finnhub's profile2 (the only free source we have for this) returns
    // nothing at all for ETFs/funds — confirmed even for SPY. That's a
    // real "we don't have this," not a genuine "Other" classification, so
    // it gets its own bucket rather than being silently folded into Other
    // (which would misleadingly look like a real categorization result).
    if (!industry) return 'Uncategorized (ETF/Fund)';
    for (const b of this.SECTOR_BUCKETS) if (b.match.test(industry)) return b.key;
    return 'Other';
  },
  PRESETS: {
    'Tech-Defense': { name: 'Tech-Defense Mix', holdings: [['QTUM',20],['SHLD',20],['IUSG',20],['REMX',20],['VGT',20]] },
    'S&P 500':      { name: 'S&P 500 Index',    holdings: [['SPY',100]] },
    '60/40':        { name: '60/40 Balanced',   holdings: [['VTI',60],['BND',40]] },
    'Growth':       { name: 'Growth Tilt',      holdings: [['VUG',30],['QQQ',30],['SMH',20],['ARKK',20]] },
  },
  SAVED_KEY: 'vanetex_backtest_saved_v1',
  // Fallback used only until the real rate loads (or if it fails to) —
  // replaced with the real 3-month T-bill yield from FRED in init().
  riskFreeRate: 0.02,
  riskFreeIsReal: false,

  state: {
    name: 'Tech-Defense Mix',
    preset: 'Tech-Defense',
    holdings: [['QTUM',20],['SHLD',20],['IUSG',20],['REMX',20],['VGT',20]].map(h => ({ t: h[0], w: h[1] })),
    start: '2020-01-01',
    end: new Date().toISOString().slice(0,10),
    initial: 10000,
    rebalance: 'Quarterly',
    tab: 'Results',
    running: false,
    hasResults: false,
    results: null,
    error: null,
    saved: [],
    compareWith: null,
    compareResult: null,
    compareLoading: false,
    hoverIdx: null,
    voice: { supported: false, listening: false, message: null, isError: false },
  },

  init() {
    try {
      const raw = localStorage.getItem(this.SAVED_KEY);
      this.state.saved = raw ? JSON.parse(raw) : [];
    } catch (e) { this.state.saved = []; }
    // sensible default window: 5 years back through today
    const end = new Date();
    const start = new Date(end); start.setFullYear(start.getFullYear() - 5);
    this.state.end = end.toISOString().slice(0,10);
    this.state.start = start.toISOString().slice(0,10);
    this.state.voice.supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    this.render();
    this.loadRiskFreeRate();
  },

  loadRiskFreeRate() {
    fetch('/api/backtest/riskfree')
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && typeof data.rate === 'number') {
          this.riskFreeRate = data.rate;
          this.riskFreeIsReal = true;
          // Only worth a re-render if there's already a result on screen using the old fallback.
          if (this.state.hasResults) this.render();
        }
      })
      .catch(() => {});
  },

  setState(patch) {
    if (typeof patch === 'function') patch = patch(this.state);
    Object.assign(this.state, patch);
    this.render();
  },

  // ---------- persistence ----------
  persistSaved() {
    try { localStorage.setItem(this.SAVED_KEY, JSON.stringify(this.state.saved)); } catch (e) {}
  },
  configKey(holdings, rebalance, start, end, initial) {
    const hs = holdings.filter(h => h.t).map(h => ({ t: h.t.toUpperCase(), w: +h.w || 0 }));
    return JSON.stringify({ hs, rebalance, start, end, initial: +initial || 10000 });
  },
  downsample(arr, n) {
    if (arr.length <= n) return arr.slice();
    const out = [];
    const step = (arr.length - 1) / (n - 1);
    for (let i = 0; i < n; i++) out.push(arr[Math.round(i * step)]);
    return out;
  },
  save() {
    const errs = this.validate();
    if (errs.length) { this.setState({ error: errs[0] }); return; }
    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      name: this.state.name || 'Untitled portfolio',
      holdings: this.state.holdings.filter(h => h.t).map(h => ({ t: h.t.toUpperCase(), w: +h.w || 0, color: h.color || null })),
      rebalance: this.state.rebalance,
      start: this.state.start,
      end: this.state.end,
      initial: +this.state.initial || 10000,
      savedAt: Date.now(),
    };
    // Snapshot a real preview (sparkline + total return) from the current
    // Results run — but only if it actually corresponds to this exact
    // config. If the holdings/dates were edited after the last run, skip
    // it rather than attach a snapshot that doesn't match what's being saved.
    const currentKey = this.configKey(this.state.holdings, this.state.rebalance, this.state.start, this.state.end, this.state.initial);
    if (this.state.hasResults && this.state.results && this._lastRunKey === currentKey) {
      const R = this.state.results;
      entry.snapshot = { equity: this.downsample(R.equity, 30), total: R.m.total };
    }
    // replace an existing save with the same name rather than piling up duplicates
    const existingIdx = this.state.saved.findIndex(s => s.name === entry.name);
    const saved = this.state.saved.slice();
    if (existingIdx >= 0) saved[existingIdx] = entry; else saved.unshift(entry);
    this.state.saved = saved;
    this.persistSaved();
    this.setState({ savedFlash: true });
    clearTimeout(this._flashTimer);
    this._flashTimer = setTimeout(() => this.setState({ savedFlash: false }), 1600);
  },
  deleteSaved(id, ev) {
    if (ev) ev.stopPropagation();
    this.state.saved = this.state.saved.filter(s => s.id !== id);
    this.persistSaved();
    if (this.state.compareWith === id) this.state.compareWith = null;
    this.render();
  },
  loadSaved(entry) {
    this.setState({
      name: entry.name,
      holdings: entry.holdings.map(h => ({ t: h.t, w: h.w, color: h.color || undefined })),
      rebalance: entry.rebalance,
      start: entry.start,
      end: entry.end,
      initial: entry.initial,
      preset: null,
      tab: 'Results',
    });
    this.run();
  },

  // ---------- holdings editing ----------
  selectPreset(id) {
    const p = this.PRESETS[id];
    this.setState({ preset: id, name: p.name, holdings: p.holdings.map(h => ({ t: h[0], w: h[1] })), hasResults: false, results: null, error: null });
  },
  addHolding() { this.setState(s => ({ holdings: [...s.holdings, { t: '', w: 0 }], preset: null })); },
  removeHolding(i) { this.setState(s => ({ holdings: s.holdings.filter((_,j) => j !== i), preset: null })); },
  setTicker(i, v) { const h = this.state.holdings.slice(); h[i] = { ...h[i], t: v.toUpperCase() }; this.setState({ holdings: h, preset: null }); },
  setWeight(i, v) { const h = this.state.holdings.slice(); h[i] = { ...h[i], w: v === '' ? '' : +v }; this.setState({ holdings: h, preset: null }); },
  setHoldingColor(i, color) { const h = this.state.holdings.slice(); h[i] = { ...h[i], color }; this.setState({ holdings: h }); },

  // ---------- voice input ----------
  // Word-to-number parsing for spoken portfolio weights ("twenty five
  // percent" -> 25) plus digit-based ("20%") since browser speech
  // recognition transcribes numbers as digits as often as words.
  VOICE_ONES: { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9,
    ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19 },
  VOICE_TENS: { twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90 },
  VOICE_FILLER: new Set(['percent','percentage','pct','at','to','for','and','add','buy','invest','put','set',
    'weight','ticker','symbol','stock','shares','of','the','with','allocate','allocated','allocation','into','in','on',
    'my','is','equals','equal','please','okay','ok']),

  voiceTokenize(transcript) {
    let t = transcript.toLowerCase();
    t = t.replace(/%/g, ' percent ');
    t = t.replace(/[^a-z0-9.\s]/g, ' ');
    return t.split(/\s+/).filter(Boolean)
      // Speech engines often append a trailing "." to a complete-sounding
      // utterance ("aapl twenty percent.") — strip stray dots from any
      // token that isn't itself a decimal number, so "percent." still
      // matches the filler word "percent".
      .map(tok => /^\d+\.\d+$/.test(tok) ? tok : tok.replace(/\./g, ''));
  },
  voiceExtractNumber(tokens) {
    for (let i = 0; i < tokens.length; i++) {
      if (/^\d+(\.\d+)?$/.test(tokens[i])) {
        return { value: parseFloat(tokens[i]), rest: tokens.slice(0, i).concat(tokens.slice(i + 1)) };
      }
    }
    const ONES = this.VOICE_ONES, TENS = this.VOICE_TENS;
    for (let i = 0; i < tokens.length; i++) {
      if (!(tokens[i] in ONES) && !(tokens[i] in TENS) && tokens[i] !== 'hundred') continue;
      let j = i, whole = 0, sawAny = false;
      while (j < tokens.length && (tokens[j] in ONES || tokens[j] in TENS || tokens[j] === 'hundred')) {
        if (tokens[j] === 'hundred') whole = (whole || 1) * 100;
        else if (tokens[j] in TENS) whole += TENS[tokens[j]];
        else whole += ONES[tokens[j]];
        sawAny = true;
        j++;
      }
      let decStr = '';
      if (tokens[j] === 'point') {
        let k = j + 1;
        while (k < tokens.length && tokens[k] in ONES) { decStr += String(ONES[tokens[k]]); k++; }
        if (decStr) j = k;
      }
      if (!sawAny) continue;
      const value = decStr ? whole + parseFloat('0.' + decStr) : whole;
      return { value, rest: tokens.slice(0, i).concat(tokens.slice(j)) };
    }
    return { value: null, rest: tokens };
  },
  voiceExtractTicker(tokens) {
    const rest = tokens.filter(t => !this.VOICE_FILLER.has(t));
    if (rest.length === 0) return null;
    if (rest.every(t => t.length === 1)) return rest.join('').toUpperCase();
    if (rest.length === 1 && /^[a-z0-9]{1,6}$/.test(rest[0])) return rest[0].toUpperCase();
    if (rest.length === 2 && rest[1].length === 1) return rest[0].toUpperCase() + '-' + rest[1].toUpperCase();
    return null;
  },
  // Pure parser, deliberately expects an actual ticker symbol to be spoken
  // (letter-by-letter or as one word) rather than a company name — a
  // reliable name-to-ticker dictionary isn't something we can guarantee
  // correct for every possible company, and guessing wrong here would be
  // worse than asking the user to say the symbol.
  parseVoiceCommand(transcript) {
    const tokens = this.voiceTokenize(transcript);
    const { value: weight, rest } = this.voiceExtractNumber(tokens);
    const ticker = this.voiceExtractTicker(rest);
    if (weight == null) return { ok: false, reason: `Didn't catch a percentage — try saying it clearly, like "AAPL twenty percent."` };
    if (!ticker) return { ok: false, reason: `Didn't catch a clear ticker — try spelling it out, like "V O O twenty percent."` };
    if (weight <= 0 || weight > 100) return { ok: false, reason: `Heard ${weight}% — portfolio weight must be between 0 and 100.` };
    return { ok: true, ticker, weight };
  },
  startVoiceInput() {
    if (this.state.voice.listening) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { this.setState({ voice: { ...this.state.voice, message: "Voice input isn't supported in this browser — try Chrome, Edge, or Safari.", isError: true } }); return; }
    if (!this._recognition) {
      this._recognition = new SR();
      this._recognition.lang = 'en-US';
      this._recognition.interimResults = false;
      this._recognition.maxAlternatives = 1;
      this._recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        this.applyVoiceResult(transcript);
      };
      this._recognition.onerror = (e) => {
        const msg = e.error === 'not-allowed' || e.error === 'permission-denied'
          ? 'Microphone access was denied — allow it in your browser settings to use voice input.'
          : e.error === 'no-speech'
          ? "Didn't hear anything — try again."
          : 'Voice input failed — try again.';
        this.setState({ voice: { ...this.state.voice, listening: false, message: msg, isError: true } });
      };
      this._recognition.onend = () => {
        if (this.state.voice.listening) this.setState({ voice: { ...this.state.voice, listening: false } });
      };
    }
    this.setState({ voice: { ...this.state.voice, listening: true, message: null, isError: false } });
    try { this._recognition.start(); } catch (e) { /* already started */ }
  },
  stopVoiceInput() {
    if (this._recognition) this._recognition.stop();
    this.setState({ voice: { ...this.state.voice, listening: false } });
  },
  applyVoiceResult(transcript) {
    const result = this.parseVoiceCommand(transcript);
    if (!result.ok) {
      this.setState({ voice: { ...this.state.voice, listening: false, message: `Heard: "${transcript}" — ${result.reason}`, isError: true } });
      return;
    }
    const holdings = this.state.holdings.slice();
    const emptyIdx = holdings.findIndex(h => !h.t);
    if (emptyIdx >= 0) holdings[emptyIdx] = { ...holdings[emptyIdx], t: result.ticker, w: result.weight };
    else holdings.push({ t: result.ticker, w: result.weight });
    this.setState({
      holdings,
      preset: null,
      voice: { ...this.state.voice, listening: false, message: `Heard: "${transcript}" → added ${result.ticker} @ ${result.weight}%`, isError: false },
    });
  },
  setName(v) { this.setState({ name: v }); },
  setStart(v) { this.setState({ start: v }); },
  setEnd(v) { this.setState({ end: v }); },
  setInitial(v) { this.setState({ initial: v === '' ? '' : +v }); },
  clampInitial() {
    let n = +this.state.initial;
    if (!n || n < 1) n = 1;
    if (n > 10000000) n = 10000000;
    this.setState({ initial: n });
  },
  setRebalance(v) { this.setState({ rebalance: v }); },

  // Mirrors MAX_SYMBOLS in app/api/backtest/prices/route.ts — that route
  // silently drops any unique ticker past this count with no per-ticker
  // error, so without this check the backtest fails downstream with a
  // misleading "no price history" error on a holding that's actually fine.
  MAX_HOLDINGS: 12,
  validate(s) {
    s = s || this.state;
    const errs = [];
    const hs = s.holdings.filter(h => h.t);
    if (!hs.length) errs.push('Add at least one holding.');
    const uniqueTickers = new Set(hs.map(h => h.t.toUpperCase()));
    if (uniqueTickers.size > this.MAX_HOLDINGS) errs.push(`A backtest can include up to ${this.MAX_HOLDINGS} holdings (currently ${uniqueTickers.size}).`);
    if (hs.some(h => !(+h.w) || +h.w <= 0)) errs.push('Every holding needs a weight greater than 0%.');
    const wt = s.holdings.reduce((a,h) => a + (+h.w || 0), 0);
    if (Math.abs(wt - 100) > 0.5) errs.push(`Weights must total 100% (currently ${wt.toFixed(1)}%).`);
    if (!s.start || !s.end) errs.push('Pick a start and end date.');
    else if (s.start >= s.end) errs.push('Start date must be before end date.');
    const initial = +s.initial;
    if (!initial || initial < 1) errs.push('Initial investment must be at least $1.');
    if (initial > 10000000) errs.push("Initial investment can't exceed $10,000,000.");
    return errs;
  },

  rebEvery(r) { return r === 'Monthly' ? 1 : r === 'Quarterly' ? 3 : r === 'Annually' ? 12 : 0; },
  toKey(iso) { const [y,m] = iso.split('-').map(Number); return y*12 + (m-1); },
  fromKey(k) { return { y: Math.floor(k/12), m: ((k%12)+12)%12 }; },
  seriesToMap(points) { const m = new Map(); for (const p of (points||[])) m.set(this.monthKeyFromUnix(p.t), p.v); return m; },
  monthKeyFromUnix(sec) { const d = new Date(sec*1000); return d.getUTCFullYear()*12 + d.getUTCMonth(); },

  // Builds a real equity curve from real monthly adjusted-close series.
  // Throws a user-facing Error for anything that makes a real backtest
  // impossible (no overlapping history, range too short, etc.) rather
  // than silently substituting anything synthetic.
  computeFor(cfg, seriesMap) {
    const hs = cfg.holdings.filter(h => h.t && (+h.w || 0) > 0);
    if (!hs.length) throw new Error('Add at least one holding.');
    const wsum = hs.reduce((a,h) => a + (+h.w || 0), 0) || 1;

    const maps = {};
    for (const h of hs) {
      const sym = h.t.toUpperCase();
      if (!maps[sym]) maps[sym] = this.seriesToMap(seriesMap[sym]);
    }
    const benchMap = this.seriesToMap(seriesMap['SPY']);

    const nowKey = this.monthKeyFromUnix(Date.now()/1000);
    let firstKey = this.toKey(cfg.start);
    let lastKey = Math.min(this.toKey(cfg.end), nowKey);

    for (const sym of Object.keys(maps)) {
      const keys = [...maps[sym].keys()];
      if (!keys.length) throw new Error(`No price history available for ${sym}.`);
      firstKey = Math.max(firstKey, Math.min(...keys));
    }
    const benchKeys = [...benchMap.keys()];
    if (benchKeys.length) firstKey = Math.max(firstKey, Math.min(...benchKeys));

    if (firstKey >= lastKey) throw new Error('Not enough overlapping price history for these holdings and date range.');

    const monthKeys = [];
    for (let k = firstKey; k <= lastKey; k++) monthKeys.push(k);
    const n = monthKeys.length - 1;
    if (n < 1) throw new Error('Date range is too short to compute a return.');

    const lookup = (map, k) => {
      if (map.has(k)) return map.get(k);
      for (let kk = k-1; kk >= firstKey; kk--) if (map.has(kk)) return map.get(kk);
      return null;
    };

    const retSeries = hs.map(h => {
      const map = maps[h.t.toUpperCase()];
      const vals = monthKeys.map(k => lookup(map, k));
      const rets = [];
      for (let i=1;i<vals.length;i++) rets.push(vals[i]!=null && vals[i-1]!=null ? (vals[i]/vals[i-1]-1) : 0);
      return rets;
    });
    const benchVals = monthKeys.map(k => lookup(benchMap, k));
    const benchRets = [];
    for (let i=1;i<benchVals.length;i++) benchRets.push(benchVals[i]!=null && benchVals[i-1]!=null ? (benchVals[i]/benchVals[i-1]-1) : 0);

    const initial = +cfg.initial || 10000;
    let vals = hs.map(h => initial * ((+h.w||0)/wsum));
    const startVals = vals.slice();
    const equity = [initial];
    const reb = this.rebEvery(cfg.rebalance);
    for (let i=0;i<n;i++) {
      for (let j=0;j<hs.length;j++) vals[j] *= (1 + retSeries[j][i]);
      const total = vals.reduce((a,b)=>a+b, 0);
      if (reb > 0 && (i+1) % reb === 0) vals = hs.map(h => total * ((+h.w||0)/wsum));
      equity.push(total);
    }
    const perAsset = hs.map((h,j) => ({ t: h.t.toUpperCase(), start: startVals[j], end: vals[j], color: h.color || this.PALETTE[j % this.PALETTE.length], w: (+h.w||0)/wsum }));

    const bench = [initial]; let bv = initial;
    for (let i=0;i<n;i++) { bv *= (1 + benchRets[i]); bench.push(bv); }

    const dates = monthKeys.map(k => this.fromKey(k));
    const m = this.metrics(equity, n);
    const bm = this.metrics(bench, n);
    const truncated = firstKey > this.toKey(cfg.start);

    return { equity, bench, perAsset, dates, m, bm, n, initial, truncated, effStart: this.fromKey(firstKey), effEnd: this.fromKey(lastKey) };
  },

  metrics(eq, n) {
    const mret = [];
    for (let i=1;i<eq.length;i++) mret.push(eq[i]/eq[i-1] - 1);
    const years = n/12;
    const total = eq[eq.length-1]/eq[0] - 1;
    const cagr = Math.pow(eq[eq.length-1]/eq[0], 1/years) - 1;
    const mean = mret.reduce((a,b)=>a+b,0) / mret.length;
    const variance = mret.reduce((a,b)=>a+(b-mean)**2,0) / mret.length;
    const vol = Math.sqrt(variance) * Math.sqrt(12);
    const sharpe = vol ? (cagr - this.riskFreeRate) / vol : 0;
    let peak = eq[0], maxDD = 0;
    for (const v of eq) { if (v>peak) peak=v; const dd=(v-peak)/peak; if (dd<maxDD) maxDD=dd; }
    // Sortino: same risk-adjusted-return idea as Sharpe, but only penalizes
    // downside volatility (returns below 0) rather than volatility in
    // either direction.
    const downsideVariance = mret.reduce((a,b) => a + Math.min(0,b)**2, 0) / mret.length;
    const downsideDev = Math.sqrt(downsideVariance) * Math.sqrt(12);
    const sortino = downsideDev ? (cagr - this.riskFreeRate) / downsideDev : 0;
    // Calmar: annualized return per unit of the worst drawdown actually experienced.
    const calmar = maxDD !== 0 ? cagr / Math.abs(maxDD) : 0;
    return { total, cagr, vol, sharpe, sortino, calmar, maxDD, best: Math.max(...mret), worst: Math.min(...mret), mret, final: eq[eq.length-1] };
  },

  // ---------- run ----------
  run() {
    if (this.state.running) return;
    const errs = this.validate();
    if (errs.length) { this.setState({ error: errs[0] }); return; }
    this.setState({ running: true, error: null });

    const tickers = [...new Set(this.state.holdings.filter(h=>h.t).map(h=>h.t.toUpperCase()))];
    fetch(`/api/backtest/prices?symbols=${encodeURIComponent(tickers.join(','))}`)
      .then(r => r.json())
      .then(data => {
        if (data.error) { this.setState({ running: false, error: data.error }); return; }
        const missing = tickers.filter(t => (data.errors||[]).includes(t));
        if (missing.length) {
          this.setState({ running: false, error: `Couldn't find price history for ${missing.join(', ')} — check the ticker${missing.length>1?'s':''}.` });
          return;
        }
        try {
          const results = this.computeFor(this.state, data.series);
          this._lastRunKey = this.configKey(this.state.holdings, this.state.rebalance, this.state.start, this.state.end, this.state.initial);
          this.loadSectors(tickers);
          this.setState({ running: false, hasResults: true, tab: 'Results', results, error: null });
        } catch (e) {
          this.setState({ running: false, error: e.message || 'Failed to compute backtest.' });
        }
      })
      .catch(() => this.setState({ running: false, error: 'Network error fetching price data. Try again.' }));
  },

  // ---------- compare tab ----------
  onCompareSelect(id) {
    if (!id) { this.setState({ compareWith: null, compareResult: null }); return; }
    const entry = this.state.saved.find(s => s.id === id);
    if (!entry) return;
    this.setState({ compareWith: id, compareResult: null, compareLoading: true });
    const tickers = [...new Set(entry.holdings.map(h => h.t.toUpperCase()))];
    fetch(`/api/backtest/prices?symbols=${encodeURIComponent(tickers.join(','))}`)
      .then(r => r.json())
      .then(data => {
        if (data.error || (data.errors||[]).some(t => tickers.includes(t))) {
          this.setState({ compareLoading: false, compareResult: { error: true } });
          return;
        }
        try {
          // compare on the SAME window/initial as the current Results run, for a fair comparison
          const cfg = { ...entry, start: this.state.results.effStart ? this.dateStr(this.state.results.effStart) : this.state.start, end: this.state.results.effEnd ? this.dateStr(this.state.results.effEnd) : this.state.end, initial: this.state.results.initial };
          const result = this.computeFor(cfg, data.series);
          this.setState({ compareLoading: false, compareResult: result });
        } catch (e) {
          this.setState({ compareLoading: false, compareResult: { error: true } });
        }
      })
      .catch(() => this.setState({ compareLoading: false, compareResult: { error: true } }));
  },

  // ---------- export ----------
  exportResults() {
    const R = this.state.results;
    if (!R) return;
    const rows = [['Date', 'Portfolio Value', 'S&P 500 Value']];
    R.dates.forEach((d,i) => rows.push([this.monLabel(d), R.equity[i].toFixed(2), R.bench[i].toFixed(2)]));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(this.state.name||'backtest').replace(/[^a-z0-9]+/gi,'_').toLowerCase()}_backtest.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  // ---------- formatting ----------
  esc(str) { return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  money(v) { return '$' + Math.round(v).toLocaleString('en-US'); },
  moneyK(v) { const av = Math.abs(v); return av >= 1000 ? (v<0?'-':'') + '$' + (av/1000).toFixed(1) + 'k' : '$' + Math.round(v); },
  pct(v, d) { return (v*100).toFixed(d==null?1:d) + '%'; },
  signed(v, d) { const s = v>=0?'+':''; return s + this.pct(v, d); },
  dateStr(k) { return `${k.y}-${String(k.m+1).padStart(2,'0')}-01`; },
  MO: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  monLabel(k) { return this.MO[k.m] + ' ' + k.y; },
  // 5 evenly-spaced-by-index date labels as a flex row below a chart —
  // matches the equity/drawdown SVGs' own index-based x positions (index 0
  // -> x=0, last index -> x=w) so justify-content:space-between lines them
  // up without needing to duplicate pixel math between the two.
  dateAxisRow(dates) {
    if (!dates || dates.length < 2) return '';
    const idxs = [...new Set([0,0.25,0.5,0.75,1].map(f => Math.round(f*(dates.length-1))))];
    const labels = idxs.map(i => this.monLabel(dates[i]));
    return `<div style="display:flex;justify-content:space-between;padding:4px 2px 0;font-family:var(--mono);font-size:9.5px;color:var(--mut);">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`;
  },
  relTime(ts) {
    const mins = Math.floor((Date.now()-ts)/60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins/60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs/24);
    if (days < 7) return days + 'd ago';
    return Math.floor(days/7) + 'w ago';
  },

  // ---------- chart helpers (real data in, SVG out) ----------
  sparkSvg(values, color, w, h) {
    w = w||120; h = h||36;
    if (!values || values.length < 2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
    const min = Math.min(...values), max = Math.max(...values), span = (max-min)||1;
    const step = w/(values.length-1);
    const d = values.map((v,i) => `${i===0?'M':'L'}${(i*step).toFixed(1)},${(h-((v-min)/span)*h).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  },
  equityChartSvg(series, w, h, id) {
    w = w||860; h = h||230;
    const all = series.flatMap(s => s.data);
    const min = Math.min(...all), max = Math.max(...all), span = (max-min)||1;
    const y = v => h - ((v-min)/span)*h;
    const paths = series.map(s => {
      const step = w/(s.data.length-1);
      const d = s.data.map((v,i) => `${i===0?'M':'L'}${(i*step).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      return { d, s };
    });
    const gridLines = [0.25,0.5,0.75].map(f => `<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="rgba(255,255,255,.05)" stroke-width="1"/>`).join('');
    const areaFor = paths[0] ? paths[0].d + ` L${w},${h} L0,${h} Z` : '';
    const lines = paths.map((p,i) => i===0
      ? `<path d="${p.d}" fill="none" stroke="${p.s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`
      : `<path d="${p.d}" fill="none" stroke="${p.s.color}" stroke-width="1.8" stroke-dasharray="${p.s.dash||'5 4'}" stroke-linejoin="round" stroke-linecap="round"/>`
    ).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block;">
      <defs><linearGradient id="btArea${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${series[0].color}" stop-opacity="0.26"/>
        <stop offset="100%" stop-color="${series[0].color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${gridLines}
      <path d="${areaFor}" fill="url(#btArea${id})"/>
      ${lines}
    </svg>`;
  },
  drawdownChartSvg(equity, w, h) {
    w = w||860; h = h||100;
    let peak = equity[0];
    const dd = equity.map(v => { if (v>peak) peak=v; return (v-peak)/peak; });
    const min = Math.min(...dd, -0.001);
    const step = w/(dd.length-1);
    const y = v => (v/min)*h;
    const line = dd.map((v,i) => `${i===0?'M':'L'}${(i*step).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = line + ` L${w},0 L0,0 Z`;
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block;">
      <defs><linearGradient id="btDd" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--neg)" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="var(--neg)" stop-opacity="0.4"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#btDd)"/>
      <path d="${line}" fill="none" stroke="var(--neg)" stroke-width="1.8"/>
    </svg>`;
  },
  // Standard SVG donut-via-stroke-dasharray technique: each segment is an
  // arc of a circle's stroke, proportional to its share of the
  // circumference, stacked by offsetting the dash pattern's start point.
  donutSvg(segments, opts) {
    const size = (opts && opts.size) || 140;
    const thickness = (opts && opts.thickness) || 24;
    const r = (size - thickness) / 2;
    const cx = size/2, cy = size/2;
    const circumference = 2 * Math.PI * r;
    let offset = 0;
    const arcs = segments.filter(s => s.value > 0).map(seg => {
      const len = seg.value * circumference;
      const dasharray = `${len.toFixed(2)} ${(circumference-len).toFixed(2)}`;
      const dashoffset = (-offset).toFixed(2);
      offset += len;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    }).join('');
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex-shrink:0;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${thickness}"/>
      ${arcs}
    </svg>`;
  },
  allocationHtml(perAsset) {
    const segments = perAsset.map(a => ({ value: a.w, color: a.color }));
    const donut = this.donutSvg(segments, { size: 140, thickness: 24 });
    const legend = perAsset.map(a => `
      <div style="display:flex;align-items:center;gap:8px;padding:5px 0;">
        <span style="width:9px;height:9px;border-radius:3px;background:${a.color};flex-shrink:0;"></span>
        <span style="font-family:var(--mono);font-weight:700;font-size:12.5px;flex:1;">${this.esc(a.t)}</span>
        <span style="font-size:12px;color:var(--mut);">${(a.w*100).toFixed(0)}%</span>
      </div>`).join('');
    return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
      <div>${donut}</div>
      <div style="flex:1;min-width:140px;">${legend}</div>
    </div>`;
  },
  loadSectors(symbols) {
    const cache = this._sectorCache || (this._sectorCache = {});
    const missing = [...new Set(symbols)].filter(s => !(s in cache));
    if (!missing.length) return;
    fetch(`/api/backtest/sectors?symbols=${encodeURIComponent(missing.join(','))}`)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data || !data.industries) return;
        Object.assign(this._sectorCache, data.industries);
        this.render();
      })
      .catch(() => {});
  },
  sectorBreakdownHtml(perAsset) {
    const cache = this._sectorCache || {};
    const allLoaded = perAsset.every(a => a.t in cache);
    if (!allLoaded) {
      return `<div style="padding:30px 14px;text-align:center;color:var(--mut);font-size:11.5px;">Loading real sector classification (Finnhub)…</div>`;
    }
    const bySector = {}; const order = [];
    perAsset.forEach(a => {
      const key = this.sectorBucket(cache[a.t]);
      if (!bySector[key]) { bySector[key] = { weight: 0, tickers: [] }; order.push(key); }
      bySector[key].weight += a.w;
      bySector[key].tickers.push(a.t);
    });
    const sectorPalette = ['#2F7BFF','#1fd397','#f5a524','#9b6bff','#34d3ff','#ec4899','#64748b','#22d3ee'];
    const segs = order.map((key,i) => ({ label: key, value: bySector[key].weight, tickers: bySector[key].tickers, color: sectorPalette[i % sectorPalette.length] }));
    const donut = this.donutSvg(segs, { size: 140, thickness: 24 });
    const legend = segs.map(s => `
      <div style="padding:7px 0;border-bottom:1px solid var(--line);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span style="width:9px;height:9px;border-radius:3px;background:${s.color};flex-shrink:0;"></span>
          <span style="font-weight:700;font-size:12.5px;flex:1;">${this.esc(s.label)}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--mut);">${(s.value*100).toFixed(0)}%</span>
        </div>
        <div style="padding-left:17px;font-family:var(--mono);font-size:10px;color:var(--mut);">${s.tickers.map(t=>this.esc(t)).join(', ')}</div>
      </div>`).join('');
    const hasUncategorized = order.includes('Uncategorized (ETF/Fund)');
    const note = hasUncategorized
      ? `<div style="margin-top:14px;font-size:10.5px;color:var(--mut);line-height:1.5;">ETFs and funds don't carry an industry classification the way individual stocks do — Finnhub's free tier (and every free alternative we checked) has no real per-fund sector breakdown, so those holdings are grouped here rather than guessed at.</div>`
      : '';
    return `<div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;">
      <div>${donut}</div>
      <div style="flex:1;min-width:180px;">${legend}</div>
    </div>${note}`;
  },

  // ============================================================
  // RENDER
  // ============================================================
  render() {
    this.renderSidebar();
    this.renderTabs();
    this.renderContent();
  },

  renderSidebar() {
    const s = this.state;
    const wt = s.holdings.reduce((a,h) => a + (+h.w||0), 0);
    const weightOk = Math.abs(wt-100) < 0.5;

    const presetRow = Object.keys(this.PRESETS).map(id => `
      <button class="presetchip" onclick="bt.selectPreset('${id}')" style="font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid ${s.preset===id?'rgba(var(--glow),.5)':'var(--line)'};background:${s.preset===id?'rgba(var(--glow),.14)':'rgba(255,255,255,.03)'};color:${s.preset===id?'var(--acc2)':'var(--mut)'};">${id}</button>`).join('');

    const holdRows = s.holdings.map((h,i) => `
      <div class="holdrow" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <label style="position:relative;width:12px;height:12px;flex-shrink:0;cursor:pointer;" title="Change ${this.esc(h.t)||'holding'} color">
          <span style="display:block;width:8px;height:8px;margin:2px;border-radius:2px;background:${h.color || this.PALETTE[i%this.PALETTE.length]};"></span>
          <input type="color" value="${h.color || this.PALETTE[i%this.PALETTE.length]}" oninput="bt.setHoldingColor(${i}, this.value)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;">
        </label>
        <input value="${this.esc(h.t)}" onchange="bt.setTicker(${i}, this.value)" placeholder="TICK" style="flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-family:var(--mono);font-size:12.5px;font-weight:700;outline:none;">
        <div style="position:relative;width:70px;">
          <input type="number" value="${h.w}" onchange="bt.setWeight(${i}, this.value)" style="width:100%;padding:9px 20px 9px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-family:var(--mono);font-size:12.5px;font-weight:700;text-align:right;outline:none;">
          <span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mut);pointer-events:none;">%</span>
        </div>
        <button class="rmx" onclick="bt.removeHolding(${i})" style="width:28px;height:28px;flex-shrink:0;border:none;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;border-radius:7px;">
          <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>`).join('');

    const errorHtml = s.error ? `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.3);color:#ff8a94;font-size:12px;line-height:1.5;">${s.error}</div>` : '';

    const runLabel = s.running ? 'Running…' : (s.hasResults ? 'Re-run backtest' : 'Run backtest');
    const runIcon = s.running
      ? `<span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;display:inline-block;animation:vx-spin .7s linear infinite;"></span>`
      : `<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5z" fill="currentColor"/></svg>`;

    document.getElementById('sidebar').innerHTML = `
      <div style="font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:10px;">Portfolio</div>
      <input value="${this.esc(s.name)}" onchange="bt.setName(this.value)" placeholder="Portfolio name" style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-size:14px;font-weight:600;outline:none;margin-bottom:14px;">
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px;">${presetRow}</div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span style="font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);">Holdings</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:10.5px;color:var(--mut);">${s.holdings.length} asset${s.holdings.length===1?'':'s'}</span>
          <button onclick="bt.${s.voice.listening ? 'stopVoiceInput' : 'startVoiceInput'}()" title="${s.voice.supported ? (s.voice.listening ? 'Listening… click to stop' : 'Speak a ticker and portfolio %, e.g. \'AAPL twenty percent\'') : 'Voice input not supported in this browser'}" class="${s.voice.listening ? 'mic-listening' : ''}" style="width:24px;height:24px;flex-shrink:0;border:1px solid ${s.voice.listening?'rgba(255,77,94,.5)':'var(--line)'};background:${s.voice.listening?'rgba(255,77,94,.12)':'rgba(255,255,255,.03)'};color:${s.voice.listening?'var(--neg)':(s.voice.supported?'var(--mut)':'rgba(124,132,153,.4)')};border-radius:7px;display:flex;align-items:center;justify-content:center;">
            <svg width="11" height="11" viewBox="0 0 12 16" fill="none"><path d="M6 0a2.5 2.5 0 0 0-2.5 2.5v5a2.5 2.5 0 0 0 5 0v-5A2.5 2.5 0 0 0 6 0z" fill="currentColor"/><path d="M1.5 7v.5a4.5 4.5 0 0 0 9 0V7M6 12v3.5M4 15.5h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
      </div>
      ${s.voice.message ? `<div style="margin-bottom:10px;padding:8px 10px;border-radius:8px;background:${s.voice.isError?'rgba(255,77,94,.08)':'rgba(31,211,151,.08)'};border:1px solid ${s.voice.isError?'rgba(255,77,94,.25)':'rgba(31,211,151,.25)'};color:${s.voice.isError?'#ff8a94':'#3ec46e'};font-size:11px;line-height:1.5;">${this.esc(s.voice.message)}</div>` : ''}
      ${holdRows}
      <button onclick="bt.addHolding()" style="width:100%;padding:9px;border-radius:9px;border:1px dashed var(--line);background:transparent;color:var(--mut);font-size:12.5px;font-weight:600;margin-bottom:8px;">+ Add holding</button>
      <div style="text-align:right;font-size:11.5px;color:${weightOk?'#3ec46e':'var(--warn)'};margin-bottom:22px;">${wt.toFixed(1)}% allocated</div>

      <div style="font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;">Settings</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:11px;color:var(--mut);margin-bottom:6px;">Start</label>
          <input type="date" value="${s.start}" onchange="bt.setStart(this.value)" style="width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-family:var(--mono);font-size:12px;outline:none;">
        </div>
        <div>
          <label style="display:block;font-size:11px;color:var(--mut);margin-bottom:6px;">End</label>
          <input type="date" value="${s.end}" max="${new Date().toISOString().slice(0,10)}" onchange="bt.setEnd(this.value)" style="width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-family:var(--mono);font-size:12px;outline:none;">
        </div>
      </div>
      <label style="display:block;font-size:11px;color:var(--mut);margin-bottom:6px;">Initial investment</label>
      <div style="position:relative;margin-bottom:12px;">
        <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;">$</span>
        <input type="number" min="1" max="10000000" value="${s.initial}" onchange="bt.setInitial(this.value)" onblur="bt.clampInitial()" style="width:100%;padding:9px 11px 9px 24px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-family:var(--mono);font-size:13px;font-weight:700;outline:none;">
      </div>
      <label style="display:block;font-size:11px;color:var(--mut);margin-bottom:6px;">Rebalance</label>
      <select onchange="bt.setRebalance(this.value)" style="width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-size:13px;margin-bottom:20px;outline:none;">
        ${['None','Monthly','Quarterly','Annually'].map(r => `<option value="${r}" ${s.rebalance===r?'selected':''}>${r==='None'?'No rebalancing':r}</option>`).join('')}
      </select>

      <button onclick="bt.run()" class="runbtn" style="width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#0B0C0F 0%,var(--acc) 165%);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px;">${runIcon}${runLabel}</button>
      <button onclick="bt.save()" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:${s.savedFlash?'#3ec46e':'var(--txt)'};font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 3h8l2 2v8H3V3z" stroke="currentColor" stroke-width="1.4"/><path d="M5 3v4h5V3" stroke="currentColor" stroke-width="1.4"/></svg>
        ${s.savedFlash ? 'Saved ✓' : 'Save portfolio'}
      </button>
      ${errorHtml}
    `;
  },

  renderTabs() {
    const s = this.state;
    const tabs = [
      { id: 'Results', label: 'Results' },
      { id: 'Saved', label: 'Saved', badge: s.saved.length ? String(s.saved.length) : null },
      { id: 'Compare', label: 'Compare' },
      { id: 'Analyze', label: 'Analyze' },
    ];
    document.getElementById('tabbar').innerHTML = tabs.map(t => `
      <button class="tabbtn" onclick="bt.setTab('${t.id}')" style="position:relative;padding:0 0 14px;border:none;background:transparent;color:${s.tab===t.id?'var(--txt)':'var(--mut)'};font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;">
        ${t.label}
        ${t.badge ? `<span style="font-family:var(--mono);font-size:10.5px;font-weight:700;background:rgba(255,255,255,.08);border-radius:99px;padding:1px 7px;color:var(--mut);">${t.badge}</span>` : ''}
        <span style="position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);border-radius:2px;opacity:${s.tab===t.id?1:0};"></span>
      </button>`).join('');
  },
  setTab(id) { this.setState({ tab: id }); },

  renderContent() {
    const s = this.state;
    const el = document.getElementById('content');
    if (s.tab === 'Results') { el.innerHTML = this.resultsHtml(); this.wireEquityHover(); return; }
    if (s.tab === 'Saved') { el.innerHTML = this.savedHtml(); return; }
    if (s.tab === 'Compare') { el.innerHTML = this.compareHtml(); return; }
    if (s.tab === 'Analyze') { el.innerHTML = this.analyzeHtml(); return; }
  },

  resultsHtml() {
    const s = this.state;
    if (s.running) {
      return `<div style="padding:100px 20px;text-align:center;">
        <span style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--acc);display:inline-block;animation:vx-spin .8s linear infinite;"></span>
        <div style="margin-top:18px;font-size:14px;color:var(--mut);">Fetching real historical prices and running the backtest…</div>
      </div>`;
    }
    if (!s.hasResults) {
      return `<div style="padding:100px 20px;text-align:center;">
        <div style="font-size:15px;font-weight:700;margin-bottom:8px;">Ready to test your edge</div>
        <div style="font-size:13px;color:var(--mut);max-width:360px;margin:0 auto;line-height:1.6;">Tune your holdings and settings, then hit <span style="color:var(--acc2);font-weight:600;">Run backtest</span> to simulate this portfolio against the S&amp;P 500 using real historical prices.</div>
      </div>`;
    }
    const R = s.results, m = R.m, bm = R.bm;
    const alpha = m.cagr - bm.cagr;
    const rangeLabel = `${this.monLabel(R.effStart)} – ${this.monLabel(R.effEnd)}`;
    const truncNote = R.truncated ? `<div style="margin-top:8px;font-size:11.5px;color:var(--warn);">Data starts ${this.monLabel(R.effStart)} — one or more holdings don't have history back to ${s.start}. Showing ${rangeLabel} instead.</div>` : '';

    const tiles = [
      { label: 'CAGR', value: this.signed(m.cagr,1), color: m.cagr>=0?'#3ec46e':'#ef5959', dot: 'var(--pos)', sub: 'annualized' },
      { label: 'Total return', value: this.signed(m.total,1), color: m.total>=0?'#3ec46e':'#ef5959', dot: 'var(--acc2)', sub: this.money(m.final) },
      { label: 'Sharpe', value: m.sharpe.toFixed(2), color: '#FAFAF7', dot: '#9b6bff', sub: 'risk-adjusted' },
      { label: 'Sortino', value: m.sortino.toFixed(2), color: '#FAFAF7', dot: '#9b6bff', sub: 'downside risk-adjusted' },
      { label: 'Calmar', value: m.calmar.toFixed(2), color: '#FAFAF7', dot: '#9b6bff', sub: 'return / max drawdown' },
      { label: 'Max drawdown', value: this.pct(m.maxDD,1), color: '#ef5959', dot: 'var(--neg)', sub: 'peak to trough' },
      { label: 'Volatility', value: this.pct(m.vol,1), color: '#FAFAF7', dot: 'var(--acc2)', sub: 'annualized' },
      { label: 'vs S&P 500', value: this.signed(alpha,1), color: alpha>=0?'#3ec46e':'#ef5959', dot: '#ec4899', sub: 'CAGR alpha' },
    ];

    return `
      <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:18px;padding:24px 28px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
          <span style="font-size:15px;font-weight:700;">${this.esc(s.name)}</span>
          <span style="font-family:var(--mono);font-size:11px;font-weight:700;background:rgba(var(--glow),.14);color:var(--acc2);border-radius:99px;padding:3px 10px;">${rangeLabel}</span>
          <span style="font-size:11.5px;color:var(--mut);">· ${s.rebalance==='None'?'no':s.rebalance.toLowerCase()} rebalance</span>
          <div style="flex:1;"></div>
          <button onclick="bt.exportResults()" style="display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-size:12px;font-weight:600;">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 11v1.5a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export results
          </button>
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;">Final portfolio value</div>
        <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;">
          <span style="font-family:var(--mono);font-size:42px;font-weight:800;">${this.money(m.final)}</span>
          <span style="font-family:var(--mono);font-size:14px;font-weight:800;color:${m.total>=0?'#3ec46e':'#ef5959'};background:${m.total>=0?'rgba(31,163,74,.12)':'rgba(220,38,38,.12)'};border:1px solid ${m.total>=0?'rgba(31,163,74,.3)':'rgba(220,38,38,.3)'};border-radius:99px;padding:5px 14px;">${this.signed(m.total,1)}</span>
        </div>
        <div style="font-size:12.5px;color:var(--mut);margin-top:8px;">Grew ${this.money(R.initial)} · ${(R.n/12).toFixed(1)} yrs · ${alpha>=0?'beat':'trailed'} the S&amp;P 500 by <span style="color:${alpha>=0?'#3ec46e':'#ef5959'};font-weight:700;">${this.pct(Math.abs(alpha),1)}</span> CAGR</div>
        ${truncNote}
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;">
        ${tiles.map(t => `
          <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:14px;padding:16px;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
              <span style="width:7px;height:7px;border-radius:50%;background:${t.dot};"></span>
              <span style="font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);">${t.label}</span>
            </div>
            <div style="font-family:var(--mono);font-size:21px;font-weight:800;color:${t.color};">${t.value}</div>
            <div style="font-size:10.5px;color:var(--mut);margin-top:2px;">${t.sub}</div>
          </div>`).join('')}
      </div>

      <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <div>
            <div style="font-size:14px;font-weight:700;">Growth of ${this.money(R.initial)}</div>
            <div style="font-size:11.5px;color:var(--mut);">Portfolio vs S&amp;P 500, ${rangeLabel}</div>
          </div>
          <div style="display:flex;gap:14px;font-size:11.5px;color:var(--mut);">
            <span><span style="display:inline-block;width:14px;height:2px;background:var(--pos);vertical-align:middle;margin-right:5px;"></span>${this.esc(s.name)}</span>
            <span><span style="display:inline-block;width:14px;height:2px;background:var(--mut);vertical-align:middle;margin-right:5px;border-top:2px dashed var(--mut);"></span>S&amp;P 500</span>
          </div>
        </div>
        <div id="eqWrap" class="eqhover" style="position:relative;margin-top:10px;">
          ${this.equityChartSvg([{ data: R.equity, color: '#1fd397' }, { data: R.bench, color: '#7c8499', dash: '5 4' }], 860, 230, 'main')}
          <div id="eqTip" style="display:none;position:absolute;top:6px;padding:8px 11px;border-radius:9px;background:rgba(8,11,20,.95);border:1px solid var(--line);font-size:11px;white-space:nowrap;pointer-events:none;"></div>
        </div>
        ${this.dateAxisRow(R.dates)}
      </div>

      <div class="btDdAlloc" style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px;">
        <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <span style="font-size:14px;font-weight:700;">Drawdown</span>
            <span style="font-family:var(--mono);font-size:13px;font-weight:800;color:#ef5959;">${this.pct(m.maxDD,1)}</span>
          </div>
          ${this.drawdownChartSvg(R.equity, 560, 100)}
          ${this.dateAxisRow(R.dates)}
        </div>
        <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;">Allocation by Holding</div>
          ${this.allocationHtml(R.perAsset)}
        </div>
      </div>

      <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <span style="font-size:14px;font-weight:700;">Diversification by Sector</span>
          <span style="font-size:8.5px;font-weight:700;letter-spacing:.08em;color:var(--pos);margin-left:auto;" title="Real industry classification per holding, from Finnhub.">REAL</span>
        </div>
        ${this.sectorBreakdownHtml(R.perAsset)}
      </div>
    `;
  },

  wireEquityHover() {
    const R = this.state.results;
    if (!R) return;
    const wrap = document.getElementById('eqWrap');
    const tip = document.getElementById('eqTip');
    if (!wrap || !tip) return;
    wrap.onmousemove = (e) => {
      const r = wrap.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      const idx = Math.round(frac * (R.equity.length - 1));
      const dt = R.dates[idx];
      tip.style.display = 'block';
      tip.style.left = Math.min(Math.max(frac*100, 8), 78) + '%';
      tip.innerHTML = `<div style="font-weight:700;margin-bottom:4px;">${this.monLabel(dt)}</div><div style="color:var(--pos);">${this.money(R.equity[idx])}</div><div style="color:var(--mut);">${this.money(R.bench[idx])} S&amp;P</div>`;
    };
    wrap.onmouseleave = () => { tip.style.display = 'none'; };
  },

  savedHtml() {
    const s = this.state;
    if (!s.saved.length) {
      return `<div style="padding:100px 20px;text-align:center;">
        <div style="font-size:15px;font-weight:700;margin-bottom:8px;">No saved portfolios yet</div>
        <div style="font-size:13px;color:var(--mut);">Build a portfolio and hit <span style="color:var(--acc2);font-weight:600;">Save portfolio</span> to keep it here.</div>
      </div>`;
    }
    return `
      <div style="font-size:13px;color:var(--mut);margin-bottom:16px;">${s.saved.length} saved portfolio${s.saved.length===1?'':'s'}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;">
        ${s.saved.map((entry,i) => {
          const chips = entry.holdings.slice(0,4).map(h => `<span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:7px;padding:2px 7px;">${this.esc(h.t)} ${+h.w||0}%</span>`).join('');
          const snap = entry.snapshot;
          const statHtml = snap
            ? `<div style="text-align:right;"><div style="font-family:var(--mono);font-size:16px;font-weight:800;color:${snap.total>=0?'#3ec46e':'#ef5959'};">${this.signed(snap.total,0)}</div><div style="font-size:10px;color:var(--mut);">total return</div></div>`
            : '';
          const sparkHtml = snap
            ? `<div style="height:44px;margin-bottom:12px;">${this.sparkSvg(snap.equity, snap.total>=0?'#1fd397':'#ef5959', 280, 44)}</div>`
            : `<div style="height:44px;margin-bottom:12px;display:flex;align-items:center;font-size:11px;color:var(--mut);">Run this portfolio to preview its curve here</div>`;
          return `
          <div class="savedcard" onclick="bt.loadSaved(bt.state.saved.find(x=>x.id==='${entry.id}'))" style="cursor:pointer;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));animation:rowIn .4s ease both;animation-delay:${(i*0.05).toFixed(2)}s;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;">
              <div>
                <div style="font-size:15px;font-weight:700;margin-bottom:4px;">${this.esc(entry.name)}</div>
                <div style="font-size:11px;color:var(--mut);">Saved ${this.relTime(entry.savedAt)} · ${entry.rebalance==='None'?'no rebalance':entry.rebalance}</div>
              </div>
              <div style="display:flex;align-items:flex-start;gap:10px;">
                ${statHtml}
                <button class="delx" onclick="bt.deleteSaved('${entry.id}', event)" style="border:none;background:transparent;color:var(--mut);width:26px;height:26px;flex-shrink:0;">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
              </div>
            </div>
            ${sparkHtml}
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${chips}</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--acc2);">Load &amp; run <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>`;
        }).join('')}
      </div>`;
  },

  compareHtml() {
    const s = this.state;
    if (!s.hasResults) {
      return `<div style="padding:100px 20px;text-align:center;">
        <div style="font-size:15px;font-weight:700;margin-bottom:8px;">Run a backtest first</div>
        <div style="font-size:13px;color:var(--mut);">Compare needs a current result to compare against.</div>
      </div>`;
    }
    const R = s.results;
    const options = s.saved.filter(sv => sv.name !== s.name);
    const rows = [{ label: s.name, color: '#1fd397', m: R.m }, { label: 'S&P 500', color: '#7c8499', m: R.bm }];
    let extraChart = '';
    if (s.compareWith && s.compareResult && !s.compareResult.error) {
      const cr = s.compareResult;
      const entry = s.saved.find(sv => sv.id === s.compareWith);
      rows.push({ label: entry.name, color: '#9b6bff', m: cr.m });
      extraChart = this.equityChartSvg([
        { data: R.equity, color: '#1fd397' },
        { data: R.bench, color: '#7c8499', dash: '5 4' },
        { data: cr.equity, color: '#9b6bff', dash: '2 3' },
      ], 860, 230, 'cmp');
    } else {
      extraChart = this.equityChartSvg([{ data: R.equity, color: '#1fd397' }, { data: R.bench, color: '#7c8499', dash: '5 4' }], 860, 230, 'cmp');
    }

    return `
      <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
          <span style="font-size:14px;font-weight:700;">Compare against</span>
          <select onchange="bt.onCompareSelect(this.value)" style="padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);font-size:12.5px;outline:none;">
            <option value="">— none —</option>
            ${options.map(o => `<option value="${o.id}" ${s.compareWith===o.id?'selected':''}>${this.esc(o.name)}</option>`).join('')}
          </select>
        </div>
        ${!options.length ? `<div style="font-size:12px;color:var(--mut);margin-bottom:12px;">Save another portfolio to compare it here.</div>` : ''}
        ${s.compareLoading ? `<div style="font-size:12px;color:var(--mut);margin-bottom:12px;">Fetching real prices for comparison…</div>` : ''}
        ${s.compareResult && s.compareResult.error ? `<div style="font-size:12px;color:var(--warn);margin-bottom:12px;">Couldn't load price history for that portfolio's holdings.</div>` : ''}
        ${extraChart}
        ${this.dateAxisRow(R.dates)}
      </div>
      <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;overflow-x:auto;">
        <div style="display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr 1fr;gap:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px;min-width:560px;">
          <span>Strategy</span><span style="text-align:right;">Final</span><span style="text-align:right;">Return</span><span style="text-align:right;">CAGR</span><span style="text-align:right;">Sharpe</span><span style="text-align:right;">Max DD</span>
        </div>
        ${rows.map(r => `
          <div style="display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr 1fr;gap:10px;padding:9px 0;align-items:center;min-width:560px;">
            <span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;"><span style="width:9px;height:9px;border-radius:50%;background:${r.color};"></span>${this.esc(r.label)}</span>
            <span style="text-align:right;font-family:var(--mono);font-size:12.5px;">${this.money(r.m.final)}</span>
            <span style="text-align:right;font-family:var(--mono);font-size:12.5px;color:${r.m.total>=0?'#3ec46e':'#ef5959'};">${this.signed(r.m.total,1)}</span>
            <span style="text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--mut);">${this.signed(r.m.cagr,1)}</span>
            <span style="text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--mut);">${r.m.sharpe.toFixed(2)}</span>
            <span style="text-align:right;font-family:var(--mono);font-size:12.5px;color:#ef5959;">${this.pct(r.m.maxDD,1)}</span>
          </div>`).join('')}
      </div>`;
  },

  analyzeHtml() {
    const s = this.state;
    if (!s.hasResults) {
      return `<div style="padding:100px 20px;text-align:center;">
        <div style="font-size:15px;font-weight:700;margin-bottom:8px;">Run a backtest first</div>
        <div style="font-size:13px;color:var(--mut);">Analyze breaks down how each holding contributed to the result.</div>
      </div>`;
    }
    const R = s.results, m = R.m;
    const totalGain = R.perAsset.reduce((a,p) => a + (p.end - p.start), 0);
    const contribRows = R.perAsset.slice().sort((a,b) => (b.end-b.start) - (a.end-a.start)).map(p => {
      const gain = p.end - p.start;
      const contribPct = totalGain !== 0 ? (gain/totalGain)*100 : 0;
      return `
        <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;padding:10px 0;align-items:center;border-bottom:1px solid var(--line);">
          <span style="display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:12.5px;"><span style="width:8px;height:8px;border-radius:2px;background:${p.color};"></span>${this.esc(p.t)}</span>
          <span style="text-align:right;font-family:var(--mono);font-size:12px;color:var(--mut);">${this.pct(p.w,0)}</span>
          <span style="text-align:right;font-family:var(--mono);font-size:12px;color:${gain>=0?'#3ec46e':'#ef5959'};">${gain>=0?'+':''}${this.money(gain)}</span>
          <span style="text-align:right;font-family:var(--mono);font-size:12px;color:var(--mut);">${contribPct.toFixed(0)}%</span>
        </div>`;
    }).join('');

    const stats = [
      { label: 'Best month', value: this.signed(m.best,1), color: '#3ec46e' },
      { label: 'Worst month', value: this.signed(m.worst,1), color: '#ef5959' },
      { label: 'Assets', value: String(R.perAsset.length), color: '#FAFAF7' },
      { label: 'Rebalance', value: s.rebalance==='None'?'None':s.rebalance, color: '#FAFAF7' },
    ];

    const riskNote = m.sharpe>=1 ? 'efficient' : m.sharpe>=0.5 ? 'moderate' : 'volatile';
    const rfLabel = this.riskFreeIsReal
      ? `${this.pct(this.riskFreeRate,2)} 3-month Treasury yield`
      : `${this.pct(this.riskFreeRate,2)} (fallback — live Treasury yield unavailable)`;
    const insight = `A Sharpe of ${m.sharpe.toFixed(2)} with ${this.pct(m.vol,0)} annual volatility and a ${this.pct(m.maxDD,0)} max drawdown — risk profile reads as ${riskNote}. ${m.sharpe>=1 ? 'Returns comfortably compensated for the risk taken.' : 'Worth weighing whether these drawdowns fit your tolerance.'} <span style="color:var(--mut);">(Sharpe assumes a ${rfLabel} risk-free rate.)</span>`;

    return `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;">
        ${stats.map(t => `
          <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:14px;padding:16px;">
            <div style="font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;">${t.label}</div>
            <div style="font-family:var(--mono);font-size:19px;font-weight:800;color:${t.color};">${t.value}</div>
          </div>`).join('')}
      </div>
      <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;">
        <div style="font-size:14px;font-weight:700;margin-bottom:14px;">Contribution by holding</div>
        <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-bottom:8px;border-bottom:1px solid var(--line);">
          <span>Ticker</span><span style="text-align:right;">Weight</span><span style="text-align:right;">Gain/loss</span><span style="text-align:right;">% of return</span>
        </div>
        ${contribRows}
      </div>
      <div style="background:linear-gradient(180deg,rgba(18,22,38,.6),rgba(8,11,20,.72));border:1px solid var(--line);border-radius:16px;padding:18px 22px;font-size:13px;line-height:1.6;color:var(--txt);">${insight}</div>
    `;
  },
};

document.addEventListener('DOMContentLoaded', () => bt.init());
</script>
</body>
</html>
